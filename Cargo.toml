[package]
name = "kova"
version = "2.0.2"
edition = "2024"

# The terminal is a library (src/lib.rs) with two clients: the `kova` binary
# below (Kova.app) and other hosts that link the static library through the C
# API (`include/kova.h`). Library and binary share the name `kova`, so log
# lines and panic messages keep their `kova::…` module paths; the outputs do
# not collide (libkova.a and libkova.rlib for the library, `kova` for the
# binary that build.sh copies into the bundle).
[lib]
name = "kova"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]
# Doc comments carry terminal transcripts and markdown fences, never Rust
# examples: they were never compiled while Kova was a binary-only crate.
doctest = false

[[bin]]
name = "kova"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSNotification", "NSRunLoop", "NSThread", "NSArray", "NSDictionary", "NSValue", "NSRange", "NSData", "NSAttributedString", "NSBundle", "NSError", "NSLocale", "NSAffineTransform"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
    "NSColor",
    "NSGraphics",
    "NSScreen",
    "NSMenu",
    "NSMenuItem",
    "NSText",
    "NSPasteboard",
    "NSImage",
    "NSTrackingArea",
    "NSCursor",
    "NSTextInputClient",
    "NSAlert",
    "NSButton",
    "NSControl",
    "NSBezierPath",
    "NSGradient",
    "NSShadow",
    "NSColorSpace",
    "NSCell",
    "NSAffineTransform",
    "NSGraphicsContext",
    "block2",
    "NSWorkspace",
    "NSAppearance",
] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLRenderCommandEncoder",
    "MTLRenderPipeline",
    "MTLTexture",
    "MTLBuffer",
    "MTLLibrary",
    "MTLRenderPass",
    "MTLDrawable",
    "MTLPixelFormat",
    "MTLResource",
    "MTLVertexDescriptor",
    "MTLDepthStencil",
    "MTLSampler",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFNumber", "CFArray", "CFRunLoop", "CFData", "CFError"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTRun", "CTFontManager", "CTFontManagerErrors", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGColorSpace", "CGBitmapContext", "CGFont", "CGPath", "CGDataProvider"] }
vte = "0.15"
rustix = { version = "1.0", features = ["termios", "process", "stdio"] }
rustix-openpty = "0.2"
parking_lot = "0.12"
log = "0.4"
simplelog = "0.12"
bitflags = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The side panel (src/window/side_panel.rs): a WKWebView for artifacts, sites
# and rendered markdown files.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigationDelegate", "WKNavigation", "WKNavigationAction", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo", "WKBackForwardList", "WKWebpagePreferences"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotification", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings", "UNError"] }
